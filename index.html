<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claude Code Task Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Outfit:wght@500;700&display=swap">
<style>
:root{
  --bg1:#dbe5f3;--bg2:#e9e3f0;--bg3:#d6e8e2;
  --glass:rgba(255,255,255,.58);--glass-strong:rgba(255,255,255,.84);--glass-border:rgba(255,255,255,.75);
  --card:rgba(255,255,255,.92);--card-hover:#fff;
  --ink:#1c2338;--ink-2:#4b5470;--ink-3:#8790a8;--line:rgba(28,35,56,.10);
  --accent:#3f6fe8;--accent-ink:#fff;--accent-soft:rgba(63,111,232,.14);--focus:rgba(63,111,232,.45);
  --l-active:#3f6fe8;--l-you:#d99a2b;--l-agent:#8b5cf6;--l-hold:#8a93a8;--l-done:#2fa876;--l-block:#d9384b;
  --tile-blue:#e6eefb;--tile-blue-i:#3f6fe8;--tile-amber:#fbefdd;--tile-amber-i:#c4832a;--tile-purple:#efe8fc;--tile-purple-i:#8b5cf6;
  --c-fable:#3f6fe8;--c-other:#d99a2b;
  --tile-red:#fde4e6;--tile-red-i:#d9384b;--tile-green:#e2f5ec;--tile-green-i:#2fa876;--tile-gray:#eceef3;--tile-gray-i:#6d7590;
  --danger:#d9384b;--shadow:0 10px 30px rgba(40,50,80,.10);--radius:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:#141a2b;--bg2:#1c1830;--bg3:#12221f;--glass:rgba(24,30,48,.62);--glass-strong:rgba(24,30,48,.88);--glass-border:rgba(255,255,255,.08);
  --card:rgba(36,43,64,.92);--card-hover:#2b3350;--ink:#e8ecf6;--ink-2:#b4bbd0;--ink-3:#7b849e;--line:rgba(255,255,255,.09);
  --accent:#6f95ff;--accent-ink:#0f1626;--accent-soft:rgba(111,149,255,.18);
  --tile-blue:#243256;--tile-blue-i:#8eaaff;--tile-amber:#3f3220;--tile-amber-i:#f0b35a;--tile-purple:#33284f;--tile-purple-i:#b79cff;
  --c-fable:#6a8ff2;--c-other:#bd8a2c;
  --tile-red:#4a2430;--tile-red-i:#ff7d8c;--tile-green:#1f3d31;--tile-green-i:#5fd3a0;--tile-gray:#2b3146;--tile-gray-i:#a3abc4;--shadow:0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg1:#141a2b;--bg2:#1c1830;--bg3:#12221f;--glass:rgba(24,30,48,.62);--glass-strong:rgba(24,30,48,.88);--glass-border:rgba(255,255,255,.08);
  --card:rgba(36,43,64,.92);--card-hover:#2b3350;--ink:#e8ecf6;--ink-2:#b4bbd0;--ink-3:#7b849e;--line:rgba(255,255,255,.09);
  --accent:#6f95ff;--accent-ink:#0f1626;--accent-soft:rgba(111,149,255,.18);
  --tile-blue:#243256;--tile-blue-i:#8eaaff;--tile-amber:#3f3220;--tile-amber-i:#f0b35a;--tile-purple:#33284f;--tile-purple-i:#b79cff;
  --c-fable:#6a8ff2;--c-other:#bd8a2c;
  --tile-red:#4a2430;--tile-red-i:#ff7d8c;--tile-green:#1f3d31;--tile-green-i:#5fd3a0;--tile-gray:#2b3146;--tile-gray-i:#a3abc4;--shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);font-size:14px;line-height:1.5;background:var(--bg1);overflow:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 50% at 20% 20%,var(--bg2),transparent 70%),radial-gradient(45% 45% at 85% 25%,var(--bg3),transparent 70%),radial-gradient(50% 50% at 60% 90%,var(--bg2),transparent 70%),var(--bg1);filter:blur(40px)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:"Outfit","Zen Kaku Gothic New",sans-serif;font-variant-numeric:tabular-nums}
code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--accent-soft);padding:1px 5px;border-radius:5px;word-break:break-all}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:12px;padding:12px 16px 16px}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--glass-border);border-radius:16px;padding:8px 12px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:8px;font-family:"Outfit",sans-serif;font-weight:700;font-size:17px;letter-spacing:.04em;padding-right:6px}
.brand svg{width:26px;height:26px}
.tb{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tb:hover{background:var(--accent-soft);color:var(--ink)}.tb[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tb svg{width:16px;height:16px}
.pill{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.search{flex:1 1 200px;min-width:150px;display:flex;align-items:center;gap:8px;background:var(--glass-strong);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.search input{flex:1;min-width:0;border:0;background:none;outline:none}.search kbd{font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-family:inherit}
select.tb{appearance:auto;border:1px solid var(--line);background:var(--glass-strong);max-width:220px}
.switch{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);padding:6px 10px;border-radius:10px;font-weight:500}
.switch i{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"] i{background:var(--accent)}.switch[aria-checked="true"] i::after{transform:translateX(14px)}
.conn{margin-left:auto;font-size:11px;line-height:1.3;padding:6px 12px;border-radius:12px;display:flex;gap:8px;align-items:center;border:1px solid transparent}
.conn b{width:7px;height:7px;border-radius:50%;flex:none}
.conn.ok{background:rgba(47,168,118,.12);color:#1f7f57;border-color:rgba(47,168,118,.25)}.conn.ok b{background:#2fa876;box-shadow:0 0 0 3px rgba(47,168,118,.2)}
.conn.ng{background:rgba(233,60,120,.10);color:#c1386a;border-color:rgba(233,60,120,.22)}.conn.ng b{background:#e8437e;box-shadow:0 0 0 3px rgba(232,67,126,.2)}

.main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;min-height:0}
.board{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:2px;scrollbar-width:thin}
.lane{background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:12px 14px 14px;box-shadow:var(--shadow)}
.lane-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}.lane-h::before{content:"";width:6px;height:22px;border-radius:4px;background:var(--lc)}
.lane-h h2{margin:0;font-size:16px;font-weight:700}.lane-h small{color:var(--ink-3);font-weight:400}
.lane-h .cnt{margin-left:auto;font-size:12px;font-weight:700;background:var(--ink);color:var(--glass-strong);border-radius:999px;padding:2px 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cards.empty{display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:12px;color:var(--ink-3);font-size:12px;min-height:44px}
.card{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--card);border-radius:14px;padding:10px 12px 10px 10px;border:2px solid transparent;position:relative;cursor:pointer;transition:transform .12s,background .12s,border-color .12s;text-align:left;width:100%;color:inherit}
.card:hover{background:var(--card-hover);transform:translateY(-1px)}.card.sel{border-color:var(--accent)}
.tile{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;background:var(--t-bg);color:var(--t-i);flex:none}.tile svg{width:28px;height:28px}
.card-body{min-width:0;display:flex;flex-direction:column;gap:6px;padding-right:22px;min-height:60px}
.card-t{font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.card-sub{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center}.card-sub .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.card-foot{margin-top:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.warn{background:rgba(217,56,75,.12);color:var(--danger)}
.who{margin-left:auto;display:inline-flex;gap:3px;color:var(--accent)}.who svg{width:18px;height:18px}
.idx{position:absolute;top:8px;right:8px;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 5px;color:var(--ink-2);line-height:16px;background:var(--card)}
.star{position:absolute;right:6px;bottom:6px;color:var(--ink-3);opacity:0;padding:2px;border-radius:6px}.card:hover .star,.star.on{opacity:1}.star.on{color:var(--l-you)}.star svg{width:16px;height:16px}

/* sessions strip */
.sess{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.sess-c{flex:0 0 260px;background:var(--card);border-radius:14px;padding:10px 12px;border:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;gap:5px;text-align:left;color:inherit}
.sess-c:hover{background:var(--card-hover)}.sess-c.sel{border-color:var(--accent)}
.sess-c .st{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700}
.sess-c .st i{width:8px;height:8px;border-radius:50%;background:var(--sc)}.sess-c .st.live i{animation:pulse 1.4s infinite}
.sess-c .pj{font-weight:700;display:flex;gap:6px;align-items:center;min-width:0}.sess-c .pj span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-c .pj small{color:var(--ink-3);font-weight:400;flex:none}
.sess-c .ti{font-size:12px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sess-c .ft{font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between;margin-top:auto}

/* panel */
.panel{min-height:0;display:flex;flex-direction:column;background:var(--glass-strong);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-scroll{flex:1;min-height:0;overflow-y:auto;padding:16px 18px 10px;scrollbar-width:thin}
.p-head{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start}
.p-head .tile{width:84px;height:84px;border-radius:18px}.p-head .tile svg{width:40px;height:40px}
.p-title{font-size:17px;font-weight:700;line-height:1.4;margin:0;text-wrap:balance;word-break:break-word}
.p-hint{font-size:11px;color:var(--ink-3);margin-top:4px}
.close{color:var(--ink-3);padding:4px;border-radius:8px;flex:none;display:grid;place-items:center}.close svg{width:18px;height:18px}.close:hover{background:var(--accent-soft);color:var(--ink)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:start;margin:18px 0 12px;font-size:13px}
.meta .k{display:flex;align-items:center;gap:8px;color:var(--ink-2);white-space:nowrap}.meta .k svg{width:16px;height:16px}
.meta .v{min-width:0;word-break:break-word}
.status{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700}
.status i{width:8px;height:8px;border-radius:50%;background:var(--sc)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-top:6px}
.tabs button{padding:10px 14px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.tabpane{padding-top:14px}
.compose{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.compose textarea{border:0;background:none;resize:none;outline:none;min-height:44px;width:100%}.compose .count{grid-column:1/-1;text-align:right;font-size:11px;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-radius:10px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn svg{width:16px;height:16px}
.notes{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.note-h{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink-2)}.note-h svg{width:18px;height:18px;color:var(--accent)}.note-h time{font-weight:400;font-size:12px;color:var(--ink-3)}
.note-h .acts{margin-left:auto;display:flex;gap:4px}.note-h .acts button{padding:4px;border-radius:6px;color:var(--ink-3)}.note-h .acts button:hover{color:var(--danger);background:rgba(217,56,75,.1)}.note-h .acts svg{width:15px;height:15px}
.note-b{margin:6px 0 0 26px;white-space:pre-wrap;word-break:break-word}
pre.desc{white-space:pre-wrap;word-break:break-word;margin:0;font-family:inherit;line-height:1.6}
pre.json{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;margin:0}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--ink-3);padding:24px}
.empty svg{width:56px;height:56px;margin-bottom:12px;color:var(--ink-3)}.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--glass-strong);padding:9px 16px;border-radius:10px;font-weight:500;pointer-events:none;transition:.2s;z-index:50}.toast.show{transform:translateX(-50%);opacity:1}
dialog{border:0;border-radius:16px;padding:20px 22px;background:var(--glass-strong);color:var(--ink);box-shadow:var(--shadow);max-width:min(92vw,460px)}dialog::backdrop{background:rgba(10,14,30,.35)}
dialog h3{margin:0 0 12px;font-size:16px}.leg{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;font-size:13px}.leg i{width:6px;height:18px;border-radius:3px;display:block}.leg svg{width:18px;height:18px;color:var(--accent)}
@media (max-width:900px){.app{padding:10px 12px 12px}.main{grid-template-columns:1fr}.panel{position:fixed;inset:10px;z-index:20;transform:translateY(105%);transition:transform .25s}.panel.open{transform:none}.conn{margin-left:0}.brand span{display:none}.cards{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* 使用量セクション: メーター（同一ランプの薄い色をトラックに）＋積み上げ棒グラフ */
.usage .lane-h small{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tb.sm{padding:4px 10px;font-size:12px}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:0 12px 10px}
.meter{background:var(--card);border-radius:14px;padding:12px 14px;--fill:var(--accent);--track:var(--accent-soft)}
.meter.sev-warn{--fill:var(--tile-amber-i);--track:var(--tile-amber)}.meter.sev-danger{--fill:var(--tile-red-i);--track:var(--tile-red)}.meter.sev-none{--fill:var(--ink-3);--track:var(--tile-gray)}
.m-l{font-size:12px;color:var(--ink-2);font-weight:500}.m-v{font-size:28px;font-weight:700;line-height:1.2;margin:2px 0 8px;display:flex;align-items:flex-end;gap:10px}.m-v small{font-size:14px;color:var(--ink-2);margin-left:2px}.m-v .dim{color:var(--ink-3)}
.m-v .spark{width:96px;height:24px;color:var(--fill);margin-left:auto;opacity:.8;flex:none}
.meter .bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}.meter .bar i{display:block;height:100%;border-radius:4px;background:var(--fill);transition:width .4s}
.m-f{font-size:11px;color:var(--ink-3);margin-top:8px;min-height:14px}.meter.is-stale .m-v,.meter.is-stale .bar{opacity:.45}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:0 14px 8px;font-size:12px;color:var(--ink-2)}.legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block}.legend .dim{color:var(--ink-3);font-size:11px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 12px}
.chart{background:var(--card);border-radius:14px;padding:10px 12px 6px;min-width:0}.c-t{font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.chart svg{width:100%;height:auto;display:block}.chart .grid{stroke:var(--line)}.chart .base{stroke:var(--ink-3);opacity:.5}.chart .ax{font-size:10px;fill:var(--ink-3)}.chart .dl{font-size:10px;fill:var(--ink-2);font-weight:700}
.s-fable{fill:var(--c-fable);background:var(--c-fable)}.s-other{fill:var(--c-other);background:var(--c-other)}
.chart .hit{stroke:var(--danger);stroke-width:1.5;stroke-dasharray:3 3}.chart .hit-t{font-size:9px;fill:var(--danger);font-weight:700}
.bar-g:hover .s-fable,.bar-g:hover .s-other{opacity:.8}.stale{color:var(--danger)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--glass-strong);border:1px solid var(--glass-border);box-shadow:var(--shadow);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--ink);display:none;max-width:300px;line-height:1.5}
@media (max-width:900px){.meters,.charts{grid-template-columns:1fr}}
</style>
</head>

  <symbol id="i-person" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>

  <symbol id="i-star" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.7 5.8 6.3.8-4.6 4.4 1.2 6.3L12 17.3 6.4 20.3l1.2-6.3L3 9.6l6.3-.8L12 3Z"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 4h12v17l-6-4-6 4V4Z"/></symbol>
  <symbol id="i-board" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="6" rx="1.5"/><rect x="14" y="14" width="7" height="6" rx="1.5"/></symbol>

  <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></symbol>
  <symbol id="i-branch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-12 2-12 7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4V5Z"/></symbol>
</svg>

<div class="app">
  <header class="topbar">
    <div class="brand"><svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4Z" fill="var(--accent)"/><path d="m8.5 12 2.5 2.5 4.5-5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span>CLAUDE CODE BOARD</span></div>
    <button class="tb" id="viewBoard" aria-pressed="true"><svg><use href="#i-board"/></svg>ボード</button>
    <button class="tb" id="viewBm" aria-pressed="false"><svg><use href="#i-bookmark"/></svg>ブックマーク <span class="pill" id="bmCount">0</span></button>
    <label class="search"><svg width="16" height="16"><use href="#i-search"/></svg><input id="q" placeholder="タスク・セッション・プロジェクト・メモで検索…" aria-label="検索"><kbd>Ctrl K</kbd></label>
    <select class="tb" id="fSess" aria-label="セッションで絞り込み"><option value="">セッション: すべて</option></select>
    <button class="switch" id="doneToggle" role="switch" aria-checked="true"><i></i>完了を表示</button>
    <button class="tb" id="themeBtn" title="テーマ切替"><svg><use href="#i-moon"/></svg></button>
    <button class="tb" id="legendBtn"><svg><use href="#i-info"/></svg>凡例</button>
    <div class="conn ng" id="conn"><b></b><span>接続中…</span></div>
  </header>
  <div class="main">
    <aside class="panel" id="panel" aria-label="タスク詳細"></aside>
    <section class="board" id="board" aria-label="ボード"></section>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="tip" id="tip" role="tooltip"></div>
<dialog id="legend">
  <h3>凡例</h3>
  <div class="leg" id="legBody"></div>
  <p style="margin:14px 0 0;font-size:12px;color:var(--ink-3)">タスクの状態は Claude Code 側の記録をそのまま表示しています（このボードからは変更しません）。付箋とブックマークは <code>board-notes.json</code> に保存されます。</p>
  <form method="dialog" style="margin-top:14px;text-align:right"><button class="btn ghost">閉じる</button></form>
</dialog>

<script>
const LANES=[
  {id:'in_progress',name:'進行中',color:'var(--l-active)',desc:'Claude Code が今取り組んでいるタスク'},
  {id:'blocked',name:'ブロック中',color:'var(--l-block)',desc:'他のタスク完了を待っている'},
  {id:'pending',name:'待機中',color:'var(--l-you)',desc:'まだ着手していないタスク'},
  {id:'completed',name:'完了',color:'var(--l-done)',desc:'終わったタスク'},
];
const SSTATE={agent:{label:'エージェント稼働中',color:'var(--l-agent)',live:true},you:{label:'あなたの入力待ち',color:'var(--l-you)',live:true},idle:{label:'待機',color:'var(--l-hold)',live:false}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg=id=>`<svg aria-hidden="true"><use href="#i-${id}"/></svg>`;
function ago(ts){const d=Math.round((Date.now()-ts)/60000);if(d<1)return'たった今';if(d<60)return d+'分前';if(d<1440)return Math.round(d/60)+'時間前';return Math.round(d/1440)+'日前'}
function fmt(ts){if(!ts)return'—';const d=new Date(ts),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}

let state={sessions:[],tasks:[],notes:{}},sel=null,selSess='',tab='notes',view='board',showDone=true;
try{const th=localStorage.getItem('ccb:theme');if(th)document.documentElement.dataset.theme=th;sel=localStorage.getItem('ccb:sel')||null}catch(e){}
const notes=()=>state.notes.notes||(state.notes.notes={});
const bms=()=>state.notes.bookmarks||(state.notes.bookmarks=[]);
async function saveNotes(){await fetch('/api/notes',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(state.notes)})}

function laneOf(t){return t.status==='completed'?'completed':t.status==='in_progress'?'in_progress':t.blocked?'blocked':'pending'}

// ---- 使用量セクション（レート制限メーター＋トークン消費グラフ） ----
const fmtTok=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+'M':n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+'K':String(Math.round(n));
const hm=ts=>{const d=new Date(ts),p=n=>String(n).padStart(2,'0');return`${p(d.getHours())}:${p(d.getMinutes())}`};
const md=ts=>{const d=new Date(ts);return`${d.getMonth()+1}/${d.getDate()}`};
function untilTxt(ts){const m=Math.max(0,Math.round((ts-Date.now())/60000));if(m<60)return`あと ${m} 分`;if(m<1440)return`あと ${Math.floor(m/60)} 時間${m%60?` ${m%60} 分`:''}`;return`あと ${Math.floor(m/1440)} 日 ${Math.floor(m%1440/60)} 時間`}
let usageOpen=true;try{usageOpen=localStorage.getItem('ccb:usage')!=='0'}catch(e){}
function meterTile(key,fallbackLabel,u,hist,fallbackFoot){
  const w=u?.windows.find(x=>x.key===key)||(key==='seven_day_fable'?u?.windows.find(x=>/^seven_day_./.test(x.key)):null);
  const pct=w?Math.max(0,Math.min(100,w.pct)):null;
  const stale=!!u&&Date.now()-u.at>60*60e3; // 1 時間以上更新が無ければ値を薄く表示
  const sev=pct==null?'none':pct>=90?'danger':pct>=70?'warn':'ok';
  const pts=w?hist.filter(h=>h.w[w.key]!=null).slice(-24):[];
  const spark=pts.length>=2?`<svg class="spark" viewBox="0 0 96 24" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" points="${pts.map((h,i)=>`${(i/(pts.length-1)*94+1).toFixed(1)},${(23-h.w[w.key]/100*22).toFixed(1)}`).join(' ')}"/></svg>`:'';
  const foot=w?`${w.resetsAt?`リセット ${fmt(w.resetsAt)}（${untilTxt(w.resetsAt)}）`:''}${stale?` · <span class="stale">${ago(u.at)}の値</span>`:''}`:(fallbackFoot||'データなし');
  return`<div class="meter sev-${sev}${stale?' is-stale':''}"><div class="m-l">${esc(w?.label||fallbackLabel)}</div><div class="m-v">${pct==null?'<span class="dim">—</span>':`<span>${Math.round(pct)}<small>%</small></span>`}${spark}</div><div class="bar"><i style="width:${pct??0}%"></i></div><div class="m-f">${foot}</div></div>`;
}
// % が取れない環境（デスクトップアプリ）向けの無料の代替: 制限に当たった記録から「今の 5 時間枠」の状況を出す
function hitFoot(hits){
  const now=Date.now(),live=hits.filter(h=>h.resetsAt&&h.resetsAt>now);
  if(live.length){const r=Math.max(...live.map(h=>h.resetsAt));return`<span class="stale">制限に到達</span> · リセット ${fmt(r)}（${untilTxt(r)}）`}
  const today=hits.filter(h=>now-h.t<24*3600e3);
  return today.length?`直近 24 時間で ${today.length} 回制限に到達（最後 ${hm(today[today.length-1].t)}）`:'% はターミナルの claude からのみ取得（README「使用量」）';
}
function barChart(title,buckets,tipLabel,hits){
  const W=600,H=150,P={l:44,r:8,t:18,b:22},iw=W-P.l-P.r,ih=H-P.t-P.b;
  const max=Math.max(1,...buckets.map(b=>b.fable+b.other));
  const p10=Math.pow(10,Math.floor(Math.log10(max))),m=max/p10,top=(m<=1?1:m<=2?2:m<=5?5:10)*p10;
  const y=v=>P.t+ih-v/top*ih,bw=iw/buckets.length,gap=Math.min(6,bw*.25),w=bw-gap;
  const grid=[.5,1].map(f=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(top*f)}" y2="${y(top*f)}" class="grid"/><text x="${P.l-6}" y="${y(top*f)+4}" class="ax" text-anchor="end">${fmtTok(top*f)}</text>`).join('');
  const maxI=buckets.reduce((mi,b,i)=>b.fable+b.other>buckets[mi].fable+buckets[mi].other?i:mi,0);
  const bars=buckets.map((b,i)=>{const x=P.l+i*bw+gap/2,tot=b.fable+b.other,yf=y(b.fable),yo=y(tot);const segs=[];
    if(b.fable>0)segs.push(`<rect x="${x}" y="${yf}" width="${w}" height="${Math.max(1,y(0)-yf)}" rx="${b.other>0?0:3}" class="s-fable"/>`);
    if(b.other>0)segs.push(`<rect x="${x}" y="${yo}" width="${w}" height="${Math.max(1,yf-yo-(b.fable>0?2:0))}" rx="3" class="s-other"/>`);
    const lab=i===maxI&&tot>0?`<text x="${x+w/2}" y="${yo-4}" class="dl" text-anchor="middle">${fmtTok(tot)}</text>`:'';
    const tip=`${tipLabel(b)}\nFable ${fmtTok(b.fable)} ・ その他 ${fmtTok(b.other)}（新規）\nキャッシュ読取 ${fmtTok(b.cached)}`;
    return`<g class="bar-g" data-tip="${esc(tip)}"><rect x="${P.l+i*bw}" y="${P.t}" width="${bw}" height="${ih}" fill="transparent"/>${segs.join('')}${lab}</g>`}).join('');
  const xl=buckets.map((b,i)=>b.lab?`<text x="${P.l+i*bw+bw/2}" y="${H-6}" class="ax" text-anchor="middle">${esc(b.lab)}</text>`:'').join('');
  const hitIdx=new Set(hits.map(h=>{for(let j=buckets.length-1;j>=0;j--)if(h.t>=buckets[j].t)return j;return -1}).filter(i=>i>=0&&hits.some(h=>h.t>=buckets[0].t)));
  const hm2=[...hitIdx].map(i=>{const x=P.l+i*bw+bw/2;return`<line x1="${x}" x2="${x}" y1="${P.t}" y2="${y(0)}" class="hit"/><text x="${x}" y="${P.t-6}" class="hit-t" text-anchor="middle">制限</text>`}).join('');
  return`<div class="chart"><div class="c-t">${title}</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">${grid}<line x1="${P.l}" x2="${W-P.r}" y1="${y(0)}" y2="${y(0)}" class="base"/>${bars}${hm2}${xl}</svg></div>`;
}
function usageSection(){
  const U=state.usage||{},u=U.windows?U:null,hist=U.history||[],tk=U.tokens||{h5:[],d7:[],hits:[]};
  const h5=tk.h5.map((b,i)=>({...b,lab:i%4===0?hm(b.t):''})),d7=tk.d7.map(b=>({...b,lab:md(b.t)}));
  const wf=d7.reduce((s,b)=>s+b.fable,0),wo=d7.reduce((s,b)=>s+b.other,0);
  const meta=u?`${u.plan?esc(u.plan)+' · ':''}${u.source==='statusline'?'ステータスライン':'手動送信'} · ${ago(u.at)}に取得`:'% は未取得 · グラフはローカル集計（トークン消費なし）';
  const body=!usageOpen?'':`<div class="meters">${meterTile('five_hour','5時間制限',u,hist,hitFoot(tk.hits))}${meterTile('seven_day','週間・全モデル',u,hist,`今週の新規トークン ${fmtTok(wf+wo)}`)}${meterTile('seven_day_fable','週間・Fable',u,hist,`今週の Fable 新規トークン ${fmtTok(wf)}`)}</div>
    <div class="legend"><i class="sw s-fable"></i>Fable <i class="sw s-other"></i>その他のモデル <span class="dim">棒＝新規トークン（入力＋キャッシュ作成＋出力）。キャッシュ読取は含めず、ホバーで表示。今週: Fable ${fmtTok(wf)} / その他 ${fmtTok(wo)}</span></div>
    <div class="charts">${barChart('直近 5 時間（15 分ごと）',h5,b=>`${hm(b.t)}–${hm(b.t+15*60e3)}`,tk.hits)}${barChart(`直近 ${d7.length} 日（日ごと）`,d7,b=>md(b.t),tk.hits)}</div>`;
  return`<section class="lane usage" style="--lc:var(--l-active)"><div class="lane-h"><h2>使用量</h2><small>${meta}</small><button class="tb sm" data-usage-toggle>${usageOpen?'折りたたむ':'展開'}</button></div>${body}</section>`;
}
function tileFor(t){const l=laneOf(t);const c={in_progress:['blue','spin'],blocked:['red','lock'],pending:['amber','doc'],completed:['green','check']}[l];return{style:`--t-bg:var(--tile-${c[0]});--t-i:var(--tile-${c[0]}-i)`,icon:c[1]}}
function filtered(){
  const q=$('#q').value.trim().toLowerCase();
  return state.tasks.filter(t=>{
    if(view==='bm'&&!bms().includes(t.id))return false;
    if(selSess&&t.sessionId!==selSess)return false;
    if(!showDone&&t.status==='completed')return false;
    if(!q)return true;
    const hay=[t.subject,t.description,t.activeForm,t.owner,t.session.project,t.session.title,t.session.branch,...(notes()[t.id]||[]).map(n=>n.text)].join(' ').toLowerCase();
    return hay.includes(q);
  });
}
function renderBoard(){
  const b=$('#board'),top=b.scrollTop;
  const list=filtered();
  $('#bmCount').textContent=bms().length;
  const sessHtml=`<section class="lane" style="--lc:var(--l-agent)"><div class="lane-h"><h2>セッション</h2><small>${state.sessions.filter(s=>s.state!=='idle').length} 稼働中</small><span class="cnt num">${state.sessions.length}件</span></div>
    <div class="sess">${state.sessions.length?state.sessions.map(s=>{const st=SSTATE[s.state];return`<button class="sess-c${selSess===s.id?' sel':''}" data-sess="${s.id}" style="--sc:${st.color}">
      <span class="st${st.live?' live':''}" style="color:${st.color}"><i></i>${st.label}</span>
      <span class="pj"><span title="${esc(s.cwd)}">${esc(s.project)}</span>${s.branch?`<small>${esc(s.branch)}</small>`:''}</span>
      <span class="ti">${esc(s.title)}</span>
      <span class="ft"><span>タスク ${s.taskCount}${s.running?` · pid ${s.pid}`:''}</span><span>${ago(s.lastAt)}</span></span></button>`}).join(''):`<div class="cards empty" style="flex:1">セッションが見つかりません</div>`}</div></section>`;
  const lanesHtml=LANES.map(l=>{
    if(l.id==='completed'&&!showDone)return'';
    const items=list.filter(t=>laneOf(t)===l.id).sort((a,b)=>b.updatedAt-a.updatedAt);
    return`<section class="lane" style="--lc:${l.color}"><div class="lane-h"><h2>${l.name}</h2>${l.id==='completed'&&state.doneDays>0?`<small>直近 ${state.doneDays} 日</small>`:''}<span class="cnt num">${items.length}件</span></div>
      <div class="cards${items.length?'':' empty'}">${items.length?items.map((t,i)=>{const tl=tileFor(t);const st=SSTATE[t.session.state];return`
        <div class="card${t.id===sel?' sel':''}" data-id="${t.id}" role="button" tabindex="0">
          <div class="tile" style="${tl.style}">${svg(tl.icon)}</div>
          <div class="card-body">
            <div class="card-t">${esc(t.subject)}</div>
            ${t.status==='in_progress'&&t.activeForm?`<div class="card-sub"><i class="dot"></i>${esc(t.activeForm)}</div>`:''}
            <div class="card-foot"><span class="tag" title="${esc(t.session.cwd)}">${esc(t.session.project)}</span>${t.blocked?`<span class="tag warn">${t.blockerSubjects.length}件待ち</span>`:''}<span class="who" title="${t.owner?esc(t.owner):st.label}" style="color:${t.owner?'var(--l-agent)':st.color}">${svg(t.owner?'bot':t.session.state==='you'?'person':'bot')}</span></div>
          </div>
          <span class="idx num">${i+1}</span>
          <button class="star${bms().includes(t.id)?' on':''}" data-bm="${t.id}" title="ブックマーク">${svg('star')}</button>
        </div>`}).join(''):'該当なし'}</div></section>`}).join('');
  b.innerHTML=usageSection()+sessHtml+lanesHtml;b.scrollTop=top;
  const sl=$('#fSess');const cur=sl.value;sl.innerHTML=`<option value="">セッション: すべて</option>`+state.sessions.map(s=>`<option value="${s.id}"${s.id===selSess?' selected':''}>${esc(s.project)} · ${esc(s.title.slice(0,30))}</option>`).join('');
}
// 左パネルの対象: 選択中のタスク > 選択中のセッション。付箋はタスクは task.id、セッションは "sess:<id>" をキーに保存
function panelTarget(){
  const t=state.tasks.find(x=>x.id===sel);if(t)return{kind:'task',t,key:t.id};
  const s=selSess&&state.sessions.find(x=>x.id===selSess);if(s)return{kind:'sess',s,key:'sess:'+s.id};
  return null;
}
function notesPane(ns){
  return`<div class="compose"><textarea id="noteIn" maxlength="300" placeholder="メモを入力…（最大300文字）"></textarea><button class="btn" id="noteAdd">貼る</button><div class="count"><span id="noteCnt">0</span> / 300</div></div>
      <div class="notes">${ns.length?ns.map((n,i)=>`<div><div class="note-h">${svg('person')}あなた<time>${ago(n.ts)}</time><span class="acts"><button data-nd="${i}" title="削除">${svg('trash')}</button></span></div><div class="note-b">${esc(n.text)}</div></div>`).join(''):`<p style="color:var(--ink-3);margin:0">付箋はまだありません。</p>`}</div>`;
}
function renderPanel(){
  const p=$('#panel'),tg=panelTarget();
  if(!tg){p.classList.remove('open');p.innerHTML=`<div class="empty"><div>${svg('board')}<b>カードを選ぶと詳細がここに出ます</b>セッションまたはタスクをクリック：内容・状態・cwd・付箋</div></div>`;return}
  p.classList.add('open');
  const ns=notes()[tg.key]||[];
  let head,meta,panes,tabs;
  if(tg.kind==='task'){
    const t=tg.t,tl=tileFor(t),lane=LANES.find(l=>l.id===laneOf(t)),st=SSTATE[t.session.state];
    head=`<div class="tile" style="${tl.style}">${svg(tl.icon)}</div>
      <div><h2 class="p-title">${esc(t.subject)}</h2><div class="p-hint">出典: ${{tasks:'~/.claude/tasks',todos:'~/.claude/todos',transcript:'セッション記録 (TodoWrite)'}[t.source]}</div></div>`;
    meta=`<span class="k">${svg('check')}状態</span><span class="v"><span class="status" style="--sc:${lane.color}"><i></i>${lane.name}</span>${t.activeForm&&t.status==='in_progress'?`<div class="p-hint" style="margin-top:6px">${esc(t.activeForm)}</div>`:''}</span>
      <span class="k">${svg('bot')}担当</span><span class="v">${t.owner?esc(t.owner):'メインエージェント'}</span>
      <span class="k">${svg('chat')}セッション</span><span class="v"><span style="color:${st.color};font-weight:700">● ${st.label}</span><div class="p-hint">${esc(t.session.title)}</div></span>
      <span class="k">${svg('folder')}プロジェクト</span><span class="v">${esc(t.session.project)}<div class="p-hint"><code>${esc(t.session.cwd)}</code></div></span>
      ${t.session.branch?`<span class="k">${svg('branch')}ブランチ</span><span class="v"><code>${esc(t.session.branch)}</code></span>`:''}
      ${t.blockedBy.length?`<span class="k">${svg('lock')}待ち先</span><span class="v">${t.blockerSubjects.length?t.blockerSubjects.map(s=>`<div>・${esc(s)}</div>`).join(''):'（すべて完了）'}</span>`:''}
      <span class="k">${svg('clock')}更新時刻</span><span class="v num" style="color:var(--ink-2)">${fmt(t.updatedAt)}（${ago(t.updatedAt)}）</span>`;
    panes={
      notes:notesPane(ns),
      desc:t.description?`<pre class="desc">${esc(t.description)}</pre>`:`<p style="color:var(--ink-3);margin:0">説明はありません。</p>`,
      raw:`<pre class="json">${esc(JSON.stringify({id:t.id,source:t.source,status:t.status,owner:t.owner,blocks:t.blocks,blockedBy:t.blockedBy,metadata:t.metadata,session:t.session},null,2))}</pre>`
    };
    tabs=[['notes',`付箋 <span class="num">${ns.length}</span>`],['desc','説明'],['raw','データ']];
  }else{
    const s=tg.s,st=SSTATE[s.state];
    head=`<div class="tile" style="--t-bg:var(--tile-purple);--t-i:var(--tile-purple-i)">${svg(s.state==='you'?'person':'bot')}</div>
      <div><h2 class="p-title">${esc(s.title)}</h2><div class="p-hint">セッション · <code>${esc(s.id.slice(0,8))}</code>${s.version?` · Claude Code ${esc(s.version)}`:''}</div></div>`;
    meta=`<span class="k">${svg('chat')}状態</span><span class="v"><span class="status" style="--sc:${st.color}"><i></i>${st.label}</span></span>
      <span class="k">${svg('folder')}プロジェクト</span><span class="v">${esc(s.project)}<div class="p-hint"><code>${esc(s.cwd)}</code></div></span>
      ${s.branch?`<span class="k">${svg('branch')}ブランチ</span><span class="v"><code>${esc(s.branch)}</code></span>`:''}
      <span class="k">${svg('bot')}プロセス</span><span class="v">${s.running?`稼働中 · <span class="num">pid ${s.pid}</span>`:'停止（記録のみ）'}</span>
      <span class="k">${svg('doc')}タスク</span><span class="v num">${s.taskCount} 件</span>
      <span class="k">${svg('clock')}開始</span><span class="v num" style="color:var(--ink-2)">${fmt(s.startedAt)}</span>
      <span class="k">${svg('clock')}最終更新</span><span class="v num" style="color:var(--ink-2)">${fmt(s.lastAt)}（${ago(s.lastAt)}）</span>`;
    panes={
      notes:notesPane(ns),
      desc:s.lastText?`<pre class="desc">${esc(s.lastText)}</pre>`:`<p style="color:var(--ink-3);margin:0">直近の発話はまだありません。</p>`,
      raw:`<pre class="json">${esc(JSON.stringify(s,null,2))}</pre>`
    };
    tabs=[['notes',`付箋 <span class="num">${ns.length}</span>`],['desc','直近の発話'],['raw','データ']];
  }
  p.innerHTML=`<div class="panel-scroll">
    <div class="p-head">${head}<button class="close" id="closeBtn" title="閉じる">${svg('x')}</button></div>
    <div class="meta">${meta}</div>
    <div class="tabs" role="tablist">${tabs.map(([id,label])=>`<button role="tab" data-tab="${id}" aria-selected="${tab===id}">${label}</button>`).join('')}</div>
    <div class="tabpane">${panes[tab]}</div></div>`;
  if(tab==='notes'){const ta=$('#noteIn');ta.addEventListener('input',()=>$('#noteCnt').textContent=[...ta.value].length)}
}
function render(){renderBoard();renderPanel()}
function select(id){sel=id;try{localStorage.setItem('ccb:sel',id||'')}catch(e){}render()}

const tip=$('#tip');
$('#board').addEventListener('mousemove',e=>{const g=e.target.closest('[data-tip]');if(!g){tip.style.display='none';return}tip.textContent=g.dataset.tip;tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=Math.min(e.clientY+14,innerHeight-tip.offsetHeight-8)+'px'});
$('#board').addEventListener('mouseleave',()=>tip.style.display='none');
$('#board').addEventListener('click',async e=>{
  const ut=e.target.closest('[data-usage-toggle]');if(ut){usageOpen=!usageOpen;try{localStorage.setItem('ccb:usage',usageOpen?'1':'0')}catch(e){}renderBoard();return}
  const bm=e.target.closest('[data-bm]');if(bm){const a=bms(),i=a.indexOf(bm.dataset.bm);i>=0?a.splice(i,1):a.push(bm.dataset.bm);render();saveNotes();return}
  const s=e.target.closest('[data-sess]');if(s){selSess=selSess===s.dataset.sess?'':s.dataset.sess;sel=null;try{localStorage.setItem('ccb:sel','')}catch(e){}render();return}
  const c=e.target.closest('.card');if(c)select(c.dataset.id);
});
$('#board').addEventListener('keydown',e=>{const c=e.target.closest('.card');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();select(c.dataset.id)}});
$('#panel').addEventListener('click',async e=>{
  const tg=panelTarget();if(!tg)return;const b=e.target.closest('button');if(!b)return;
  if(b.id==='closeBtn'){if(tg.kind==='task')select(null);else{selSess='';render()}}
  else if(b.dataset.tab){tab=b.dataset.tab;renderPanel()}
  else if(b.id==='noteAdd'){const v=$('#noteIn').value.trim();if(!v)return;(notes()[tg.key]||(notes()[tg.key]=[])).push({text:v,ts:Date.now()});render();await saveNotes();toast('付箋を貼りました')}
  else if(b.dataset.nd!==undefined){notes()[tg.key].splice(+b.dataset.nd,1);render();saveNotes()}
});
$('#panel').addEventListener('keydown',e=>{if(e.target.id==='noteIn'&&e.key==='Enter'&&(e.metaKey||e.ctrlKey))$('#noteAdd').click()});
$('#q').addEventListener('input',renderBoard);
$('#fSess').addEventListener('change',e=>{selSess=e.target.value;render()});
$('#viewBoard').addEventListener('click',()=>{view='board';$('#viewBoard').setAttribute('aria-pressed','true');$('#viewBm').setAttribute('aria-pressed','false');renderBoard()});
$('#viewBm').addEventListener('click',()=>{view='bm';$('#viewBoard').setAttribute('aria-pressed','false');$('#viewBm').setAttribute('aria-pressed','true');renderBoard()});
$('#doneToggle').addEventListener('click',e=>{showDone=!showDone;e.currentTarget.setAttribute('aria-checked',showDone);renderBoard()});
$('#themeBtn').addEventListener('click',()=>{const r=document.documentElement;const dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('ccb:theme',r.dataset.theme)}catch(e){}});
$('#legendBtn').addEventListener('click',()=>{$('#legBody').innerHTML=LANES.map(l=>`<i style="background:${l.color}"></i><span><b>${l.name}</b> — ${l.desc}</span>`).join('')+Object.values(SSTATE).map(s=>`<i style="background:${s.color}"></i><span><b>${s.label}</b>（セッション）</span>`).join('')+`${svg('star')}<span>ブックマーク（カード右下の星）</span>`;$('#legend').showModal()});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus();$('#q').select()}if(e.key==='Escape'&&(sel||selSess)&&!$('#legend').open&&document.activeElement.tagName!=='TEXTAREA'){if(sel)select(null);else{selSess='';render()}}});

async function refresh(){
  try{
    const r=await fetch('/api/state',{cache:'no-store'});const d=await r.json();
    const draft=$('#noteIn')?.value;
    state=d;
    const c=$('#conn');c.className='conn '+(d.dirExists?'ok':'ng');
    c.innerHTML=`<b></b><span>${d.dirExists?'ローカル接続':'フォルダ未検出'} <code style="background:none;padding:0">${esc(d.claudeDir)}</code><br>${d.sessions.filter(s=>s.state!=='idle').length} セッション稼働 · タスク ${d.tasks.length} 件 · ${new Date(d.scannedAt).toLocaleTimeString('ja-JP')} 更新</span>`;
    if(document.activeElement?.id==='noteIn'){renderBoard()}else{render();if(draft&&$('#noteIn'))$('#noteIn').value=draft}
  }catch(e){const c=$('#conn');c.className='conn ng';c.innerHTML=`<b></b><span>サーバーに接続できません<br>node server.mjs を起動してください</span>`}
}
refresh();
try{const es=new EventSource('/api/events');es.onmessage=refresh;es.onerror=()=>{}}catch(e){}
setInterval(refresh,15000);
</script>
</body>
</html>
